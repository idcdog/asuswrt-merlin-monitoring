# Optional IF-MIB collection for operators who need every router interface.
# The default dashboard and SSH collector do not require these jobs.
scrape_configs:
  - job_name: asus_rt_be88u
    scrape_interval: 30s
    scrape_timeout: 20s
    metrics_path: /snmp
    params:
      auth: [asus_router_v2]
      module: [if_mib]
    static_configs:
      - targets: [192.168.1.1]
        labels:
          device: ASUS-Router
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9116

  - job_name: snmp_exporter
    static_configs:
      - targets: ["127.0.0.1:9116"]
